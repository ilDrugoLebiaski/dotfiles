unbind r
bind r source-file ~/.tmux.conf

unbind C-b
set -g prefix C-a
bind-key C-a send-prefix

set -g mouse on
set -g set-clipboard on
set -g default-terminal "tmux-256color"
set -as terminal-overrides ',*:Tc'

# Split panes
unbind %
bind | split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# LDUR pane navigation
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Indici da 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Alt+numero per selezionare finestra
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

set-option -g status-position top
set -g status-style                 bg=colour0,fg=colour7

set -g window-status-current-format " #I #W "
set -g window-status-current-style  bg=colour4,fg=colour0,bold

set -g window-status-format         " #I #W "
set -g window-status-style          bg=colour0,fg=colour8

set -g pane-border-style            fg=colour8
set -g pane-active-border-style     fg=colour4

set -g message-style                bg=colour3,fg=colour0

set -g status-left-length 30
set -g status-left                  " #[bold]#S #[nobold]"
set -g status-left-style            bg=colour4,fg=colour0


set -g status-right-length 30
set -g status-right                 " %H:%M %d/%m "
set -g status-right-style           bg=colour0,fg=colour8

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'

run '~/.tmux/plugins/tpm/tpm'
